server:
  # Render/PaaS injecte le port via $PORT ; 8080 en local.
  port: ${PORT:8080}

# Origines autorisées pour CORS (séparées par des virgules).
# En prod : mettre l'URL du frontend, ex. https://nancy-immo.netlify.app
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # URL du frontend (redirections Stripe + lien de réinitialisation par email).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  # Expéditeur des emails. Si vide, aucun email n'est envoyé (le lien est écrit dans les logs).
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  # Connexion Google : Client ID OAuth 2.0 (console Google Cloud). Vide = bouton Google masqué.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

# Paiements Stripe. Renseigner STRIPE_SECRET_KEY (clé test sk_test_…).
# Le webhook (optionnel) nécessite STRIPE_WEBHOOK_SECRET (whsec_…).
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${db_host:localhost}:${db_port:5432}/${db_name:nancyImmo}
    username: ${db_username:postgres}
    password: ${db_password:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      # Pièces justificatives uploadées (pièce d'identité, etc.)
      max-file-size: 10MB
      max-request-size: 12MB
  # SMTP pour l'envoi des emails de réinitialisation.
  # Gmail : générer un « mot de passe d'application » (compte avec 2FA activée).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
